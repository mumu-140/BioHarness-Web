[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bioharness-web"
version = "0.3.0"
description = "BioHarness Research Workspace: read side and native model runtime over the public Core and Module interfaces"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.12,<3",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-ai-slim[openai]>=2.75,<3",
  "mcp>=2.3,<3",
]

[project.scripts]
bioharness-web = "bioharness_web.__main__:main"

[project.optional-dependencies]
dev = [
  "anyio>=4.9,<5",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/bioharness_web"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
