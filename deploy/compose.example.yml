services:
  observatory:
    image: bioharness-web:observatory-v1
    restart: unless-stopped
    environment:
      BIOHARNESS_WEB_DATABASE_URL: ${BIOHARNESS_WEB_DATABASE_URL}
      BIOHARNESS_WEB_POLL_INTERVAL_SECONDS: ${BIOHARNESS_WEB_POLL_INTERVAL_SECONDS:-2}
      # Optional evidence previews:
      # BIOHARNESS_WEB_EVIDENCE_HOST_ROOT: ${BIOHARNESS_WEB_EVIDENCE_HOST_ROOT}
      # BIOHARNESS_WEB_EVIDENCE_MOUNT_ROOT: ${BIOHARNESS_WEB_EVIDENCE_MOUNT_ROOT}
      # BIOHARNESS_WEB_EVIDENCE_PREVIEW_MAX_BYTES: ${BIOHARNESS_WEB_EVIDENCE_PREVIEW_MAX_BYTES:-131072}
    # When evidence previews are enabled, mount the same narrow provider-output
    # root read-only:
    # volumes:
    #   - ${BIOHARNESS_WEB_EVIDENCE_HOST_ROOT}:${BIOHARNESS_WEB_EVIDENCE_MOUNT_ROOT}:ro
    ports:
      - "127.0.0.1:${BIOHARNESS_WEB_PORT:-18080}:8080"
    networks:
      - bioharness

networks:
  bioharness:
    external: true
    name: ${BIOHARNESS_WEB_DOCKER_NETWORK}
